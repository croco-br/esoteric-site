<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerador de sons com frequências de chakras, solfeggio e batidas binaurais para meditação e relaxamento.">
    <meta name="theme-color" content="#211f35">
    <title>{% block title %}Gerador de Sons{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%238b5cf6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ static_url(request, 'css/app.css') }}">
    {% block css %}{% endblock %}
    <link rel="stylesheet" href="/site.css">
    {% block js %}{% endblock %}
</head>

<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    {% include 'header.html' %}
    <main id="conteudo">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">
            Casa Arcana · Um espaço para observar o que se move por dentro e por fora.
        </div>
    </footer>
</body>

</html>
